server.port=0

# ---- 周期任务引擎配置 ----
# 工作线程数
engine.worker-pool-size=4
# 全局限速：每秒允许开始的执行数（<=0 不限）
engine.rate-limit=10
# 执行队列容量（有界，溢出记为 QUEUE_FULL）
engine.queue-capacity=200
# 触发调度轮询间隔
engine.tick-interval=200ms
# 排队/并发等待超时
engine.acquire-timeout=5s
# 默认补跑窗口：(now-window, now] 内错过的触发点补算，更早记为跳过
engine.default-catch-up-window=1h
# 默认重试次数（含首次）
engine.default-max-attempts=3
# 默认退避基数/上限/因子/抖动
engine.default-backoff-base=1s
engine.default-backoff-max=30s
engine.default-backoff-factor=2.0
engine.default-jitter-ratio=0.2
# H2 持久化文件路径
engine.db-path=./data/scheduled-task-engine
